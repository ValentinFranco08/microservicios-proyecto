spring:
  application:
    name: usuario-service
  
  datasource:
    url: jdbc:postgresql://usuario-db:5432/usuarios_db
    username: usuario
    password: usuario123
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8001
  servlet:
    context-path: /usuario-service

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.microservices: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
