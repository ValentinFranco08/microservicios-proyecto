name: Microservices CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-run:
    name: Build, run and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build usuario-service
        working-directory: usuario-service
        run: mvn --batch-mode clean package

      - name: Build pedido-service
        working-directory: pedido-service
        run: mvn --batch-mode clean package

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build Docker images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for containers to become healthy
        run: |
          set -euo pipefail

          services="usuario-db pedido-db usuario-service pedido-service"

          for service in $services; do
            echo "Waiting for $service..."
            for attempt in $(seq 1 30); do
              status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$service")"
              echo "$service status: $status"

              if [ "$status" = "healthy" ]; then
                break
              fi

              if [ "$attempt" = "30" ]; then
                echo "$service did not become healthy in time"
                docker logs "$service" || true
                exit 1
              fi

              sleep 5
            done
          done

      - name: Smoke test APIs
        run: |
          set -euo pipefail

          curl -fsS http://localhost:18001/usuario-service/v3/api-docs > /dev/null
          curl -fsS http://localhost:18002/pedido-service/v3/api-docs > /dev/null

          curl -fsS -X POST http://localhost:18001/usuario-service/api/v1/usuarios \
            -H "Content-Type: application/json" \
            -d '{
              "email": "ci-user@example.com",
              "nombre": "CI",
              "apellido": "User",
              "telefono": "1111111111",
              "direccion": "CI Street 123",
              "ciudad": "Buenos Aires",
              "pais": "Argentina"
            }' > /tmp/usuario.json

          usuario_id="$(python3 -c 'import json; print(json.load(open("/tmp/usuario.json"))["id"])')"
          curl -fsS "http://localhost:18001/usuario-service/api/v1/usuarios/${usuario_id}" > /dev/null

          cat > /tmp/pedido-request.json <<JSON
          {
            "usuarioId": ${usuario_id},
            "numeroProducto": "CI-001",
            "nombreProducto": "Producto CI",
            "cantidad": 1,
            "precioUnitario": 100.00,
            "descripcion": "Pedido creado desde GitHub Actions",
            "direccionEnvio": "CI Street 123, Buenos Aires"
          }
          JSON

          curl -fsS -X POST http://localhost:18002/pedido-service/api/v1/pedidos \
            -H "Content-Type: application/json" \
            -d @/tmp/pedido-request.json > /tmp/pedido.json

          pedido_id="$(python3 -c 'import json; print(json.load(open("/tmp/pedido.json"))["id"])')"
          curl -fsS "http://localhost:18002/pedido-service/api/v1/pedidos/${pedido_id}/detalles" > /dev/null

      - name: Show container status
        if: always()
        run: docker compose ps

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v
